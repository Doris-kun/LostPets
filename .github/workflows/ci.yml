name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      # mongodb-memory-server tải một bản MongoDB thật để dựng database trong RAM.
      # Không cache thì mỗi lần chạy CI lại tải lại khoảng 100MB.
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Install dependencies
        run: npm ci
        working-directory: back-end

      - name: Run tests
        run: npm test
        working-directory: back-end

  build-frontend:
    name: build-frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: front-end

      # Bắt lỗi cú pháp và import hỏng trong Vue trước khi vào main.
      - name: Build
        run: npm run build
        working-directory: front-end
